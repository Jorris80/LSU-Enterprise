<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LSU Enterprise Platform</title>
<meta name="description" content="Digitalisasi Leaf Sampling Unit (LSU) kelapa sawit multi-estate: GIS, perencanaan, survei lapangan offline, chain of custody sampel, laboratorium QA/QC, dan rekomendasi pupuk.">
<meta name="theme-color" content="#064e3b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LSU Mobile">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<!-- Leaflet & PMTiles dimuat saat Peta dibuka (lazy) agar halaman awal/login lebih cepat -->
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js" crossorigin="anonymous" defer></script>
<style>
:root{--pri:#064e3b;--pri2:#047857;--pri3:#d1fae5;--acc:#d97706;--bg:#f1f5f4;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--bad:#b91c1c;--badbg:#fee2e2;--ok:#15803d;--okbg:#dcfce7;--warn:#b45309;--warnbg:#fef3c7;--info:#1d4ed8;--infobg:#dbeafe;--r:12px;--sh:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.05);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri2)}
.hide{display:none!important}
/* ---------- Login ---------- */
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:radial-gradient(1200px 600px at 10% -10%,#0f766e 0,transparent 60%),linear-gradient(160deg,var(--pri) 0,#022c22 100%)}
.login-card{width:100%;max-width:400px;background:#fff;border-radius:18px;padding:28px 24px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.login-brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;margin-bottom:18px}
.login-brand img,.login-brand .logo-ph{width:84px;height:84px;border-radius:20px;object-fit:contain;background:var(--pri3);cursor:zoom-in}
.login-brand h1{font-size:20px;margin:6px 0 0}
.login-brand p{margin:0;color:var(--mut);font-size:13px}
.login-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:12px;color:var(--mut)}
/* ---------- Shell ---------- */
#app{min-height:100%;display:flex;flex-direction:column}
#topwrap{position:sticky;top:0;z-index:900}
header.top{background:var(--pri);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 14px;min-height:56px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand img,.brand .logo-ph{width:38px;height:38px;border-radius:10px;object-fit:contain;background:rgba(255,255,255,.14);cursor:zoom-in;flex:none}
.logo-ph{display:flex;align-items:center;justify-content:center;font-size:20px}
.brand .tt{min-width:0}
.brand .t1{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.brand .t2{font-size:11.5px;opacity:.78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.edit-pen{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:6px;width:24px;height:24px;cursor:pointer;font-size:12px;flex:none}
.top-r{display:flex;align-items:center;gap:8px}
.top select{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:6px 8px;max-width:190px}
.top select option{color:#0f172a}
.net{font-size:11px;padding:4px 8px;border-radius:99px;background:rgba(255,255,255,.15);white-space:nowrap;cursor:pointer;border:0;color:#fff}
.net.off{background:#b45309}
.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#fff;color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer;border:2px solid rgba(255,255,255,.6);flex:none}
.layout{flex:1;display:flex;min-height:0}
nav.side{width:224px;flex:none;background:#fff;border-right:1px solid var(--line);padding:12px 8px;position:sticky;top:101px;height:calc(100vh - 101px);overflow:auto}
nav.side button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;padding:9px 12px;border-radius:9px;cursor:pointer;text-align:left;color:#334155}
nav.side button:hover{background:#f1f5f9}
nav.side button.on{background:var(--pri3);color:var(--pri);font-weight:600}
nav.side .ico,.bnav .ico{font-size:17px;width:22px;text-align:center}
nav.side .sep{height:1px;background:var(--line);margin:8px 6px}
main{flex:1;min-width:0;padding:18px;max-width:1280px;width:100%;margin:0 auto}
.bnav{display:none}
.badge-dot{background:var(--bad);color:#fff;border-radius:99px;font-size:10px;padding:1px 6px;margin-left:auto}
/* ---------- Komponen ---------- */
h2.pg{font-size:20px;margin:0 0 4px}
.pg-sub{color:var(--mut);margin:0 0 16px;font-size:13px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px;min-width:0}
.card h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .v{font-size:24px;font-weight:700;color:var(--pri)}
.kpi .l{font-size:12px;color:var(--mut)}
.kpi .s{font-size:11.5px;color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 13px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;min-height:38px}
.btn:hover{background:#f8fafc}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.p:hover{background:var(--pri2)}
.btn.d{color:var(--bad);border-color:#fecaca}
.btn.w{color:var(--warn);border-color:#fde68a}
.btn.s{padding:5px 9px;min-height:30px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.blk{width:100%}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:#334155;min-width:0}
input.i,select.i,textarea.i{border:1px solid #cbd5e1;border-radius:9px;padding:9px 11px;background:#fff;width:100%;min-height:40px;font-size:14px}
input.i:focus,select.i:focus,textarea.i:focus{outline:2px solid var(--pri3);border-color:var(--pri2)}
textarea.i{min-height:72px;resize:vertical}
.fg{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.fg .full{grid-column:1/-1}
.chk{display:flex;align-items:center;gap:8px;font-size:13px}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{background:#f8fafc;text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:#475569;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid #f1f5f9;vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t tr.sel td{background:#f0fdf4}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:#f1f5f9;color:#334155;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.info{background:var(--infobg);color:var(--info)}
.alert{padding:10px 12px;border-radius:10px;font-size:13px;border:1px solid}
.alert.warn{background:var(--warnbg);border-color:#fde68a;color:#78350f}.alert.bad{background:var(--badbg);border-color:#fecaca;color:#7f1d1d}.alert.info{background:var(--infobg);border-color:#bfdbfe;color:#1e3a8a}.alert.ok{background:var(--okbg);border-color:#bbf7d0;color:#14532d}
.tabs{display:flex;gap:6px;overflow:auto;border-bottom:1px solid var(--line);margin-bottom:14px;scrollbar-width:none}
.tabs button{border:0;background:none;padding:9px 12px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;color:var(--mut);font-weight:600}
.tabs button.on{color:var(--pri);border-bottom-color:var(--pri)}
.empty{padding:28px;text-align:center;color:var(--mut)}
.muted{color:var(--mut)}.small{font-size:12px}
.bar{height:8px;border-radius:99px;background:#e2e8f0;overflow:hidden}.bar>i{display:block;height:100%;background:var(--pri2)}
.timeline{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.timeline .ev{position:relative;margin-bottom:12px}
.timeline .ev:before{content:"";position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--pri2)}
.nut{display:grid;grid-template-columns:42px 1fr 96px 112px;gap:8px;align-items:center;font-size:13px;padding:4px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
/* ---------- Modal, toast, lightbox ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(2,6,23,.55);z-index:2000;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:16px;width:100%;max-width:640px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.modal.wide{max-width:960px}
.modal .mh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.modal .mh h3{margin:0;font-size:16px;flex:1}
.modal .mb{padding:16px;overflow:auto}
.modal .mf{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x{border:0;background:#f1f5f9;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:16px}
#toasts{position:fixed;right:16px;bottom:16px;z-index:3000;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 32px))}
.toast{background:#0f172a;color:#fff;padding:10px 14px;border-radius:10px;box-shadow:var(--sh);font-size:13px;animation:tin .2s ease}
.toast.bad{background:#991b1b}.toast.ok{background:#166534}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
#lightbox{position:fixed;inset:0;z-index:2500;background:rgba(2,6,23,.92);display:flex;flex-direction:column;touch-action:none}
#lightbox .lb-stage{flex:1;overflow:hidden;position:relative;cursor:grab}
#lightbox .lb-stage.drag{cursor:grabbing}
#lightbox img{position:absolute;left:50%;top:50%;max-width:none;transform-origin:0 0;user-select:none;-webkit-user-drag:none}
#lightbox .lb-bar{display:flex;gap:8px;align-items:center;justify-content:center;padding:10px;padding-bottom:calc(10px + var(--safe-b));color:#fff;flex-wrap:wrap}
#lightbox .lb-bar button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:9px;min-width:42px;height:40px;font-size:16px;cursor:pointer;padding:0 12px}
#lightbox .lb-cap{position:absolute;top:10px;left:12px;right:60px;color:#fff;font-size:13px;opacity:.85}
#lightbox .lb-x{position:absolute;top:8px;right:10px;z-index:2}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
.spin.dk{border-color:#cbd5e1;border-top-color:var(--pri)}
@keyframes sp{to{transform:rotate(360deg)}}
#busy{position:fixed;top:0;left:0;right:0;height:3px;z-index:3001;background:linear-gradient(90deg,transparent,var(--acc),transparent);background-size:200% 100%;animation:bz 1s linear infinite}
@keyframes bz{from{background-position:200% 0}to{background-position:-200% 0}}
/* ---------- Peta ---------- */
.map-wrap{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#e2e8f0}
#map{height:calc(100vh - 210px);min-height:420px}
.map-wrap.fs{position:fixed;inset:0;z-index:1500;border-radius:0}
.map-wrap.fs #map{height:100vh}
.map-tools{position:absolute;top:10px;left:54px;z-index:800;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 120px)}
.map-tools .btn{min-height:34px;padding:6px 10px;box-shadow:var(--sh)}
.map-tools .btn.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.map-info{position:absolute;left:10px;bottom:24px;z-index:800;background:rgba(255,255,255,.95);border-radius:9px;padding:6px 9px;font-size:11.5px;box-shadow:var(--sh);max-width:calc(100% - 20px)}
.map-legend{position:absolute;right:10px;bottom:24px;z-index:800;background:rgba(255,255,255,.96);border-radius:10px;padding:8px 10px;font-size:11.5px;box-shadow:var(--sh);max-width:210px}
.map-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.leaflet-container{font:inherit}
.leaflet-popup-content{font-size:13px;margin:10px 12px;min-width:180px}
.measuring .leaflet-interactive{pointer-events:none!important}.measuring{cursor:crosshair!important}
.lbl-blk{background:none;border:0;box-shadow:none;color:#fff;font-weight:700;text-shadow:0 0 3px #000,0 0 6px #000;font-size:12px}
/* ---------- Survei ---------- */
.tree-item{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:8px}
.tree-item .st{width:12px;height:12px;border-radius:50%;background:#cbd5e1;flex:none}
.tree-item.done .st{background:var(--ok)}.tree-item.flag .st{background:var(--acc)}
.photo-prev{width:100%;max-height:220px;object-fit:cover;border-radius:10px;cursor:zoom-in}
.qr-label{border:1.5px dashed #94a3b8;border-radius:10px;padding:10px;display:flex;gap:10px;align-items:center;background:#fff;break-inside:avoid}
.qr-label svg,.qr-label img{width:96px;height:96px;flex:none}
#scanVideo{width:100%;border-radius:10px;background:#000;max-height:50vh}
.prof-photo{width:120px;height:120px;border-radius:50%;object-fit:cover;cursor:zoom-in;border:3px solid var(--pri3);background:var(--pri3);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700;color:var(--pri)}
/* ---------- Print ---------- */
#printArea{display:none}
@media print{body:not(.pm)>*:not(#printArea){display:none!important}#printArea{display:block!important;padding:0;color:#000}#printArea .doc{font-size:12px}@page{margin:14mm}}
.doc h1{font-size:18px;margin:0}.doc h2{font-size:14px;margin:14px 0 6px}.doc table{width:100%;border-collapse:collapse}.doc td,.doc th{border:1px solid #333;padding:4px 6px;font-size:11.5px;text-align:left}.doc .hdr{display:flex;gap:12px;align-items:center;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:10px}.doc .hdr img{width:56px;height:56px;object-fit:contain}.doc .sig{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:30px;text-align:center}.doc .sig div{padding-top:60px;border-bottom:1px solid #000}
/* ---------- Responsif ---------- */
@media (max-width:1024px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  nav.side{display:none}
  main{padding:12px 12px calc(84px + var(--safe-b))}
  .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:950;background:#fff;border-top:1px solid var(--line);padding:4px 4px calc(4px + var(--safe-b));box-shadow:0 -4px 16px rgba(0,0,0,.06)}
  .bnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:#475569;padding:6px 2px;border-radius:8px;cursor:pointer;min-width:0}
  .bnav button.on{color:var(--pri);background:var(--pri3);font-weight:700}
  .bnav button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  header.top{padding:8px 10px;gap:8px}
  .top select{max-width:120px;font-size:12px}
  #map{height:calc(100vh - 230px);min-height:360px}
  .g2,.g3{grid-template-columns:1fr}
  .modal-bg{padding:0;align-items:flex-end}
  .modal{max-height:94vh;border-radius:16px 16px 0 0}
  .modal .mf{padding-bottom:calc(12px + var(--safe-b))}
  table.t.rsp thead{display:none}
  table.t.rsp tr{display:block;border-bottom:1px solid var(--line);padding:6px 0}
  table.t.rsp td{display:flex;justify-content:space-between;gap:10px;border:0;padding:4px 10px;text-align:right}
  table.t.rsp td:before{content:attr(data-l);font-weight:600;color:var(--mut);text-align:left;font-size:12px}
  table.t.rsp td.act{justify-content:flex-end}
  table.t.rsp td.act:before{content:none}
  .nut{grid-template-columns:34px 1fr 90px;}.nut .cls{grid-column:2/4}
  #toasts{left:16px;right:16px;bottom:calc(76px + var(--safe-b));max-width:none}
  .map-tools{left:10px;top:auto;bottom:70px;max-width:calc(100% - 20px)}
  .map-legend{bottom:auto;top:10px;right:50px;max-width:160px}
}
@media (max-width:520px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.brand .t2{display:none}.net .lbl{display:none}.kpi .v{font-size:20px}}

/* ---------- Filter PT/Estate/AFD ---------- */
#fbar{background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 6px rgba(15,23,42,.05)}
.fb-full{display:flex;align-items:center;gap:8px;padding:6px 14px;min-height:45px}
.fb-full select{border:1px solid #cbd5e1;border-radius:8px;padding:6px 8px;background:#fff;max-width:240px;font-size:13px}
.fb-l{font-weight:700;font-size:12px;color:var(--pri)}
.fb-mini{display:none;gap:6px;padding:6px 10px}
.fb-sum{flex:1;justify-content:flex-start;overflow:hidden;text-overflow:ellipsis}
/* ---------- Skeleton ---------- */
.sk-title{height:26px;width:260px;border-radius:8px;margin-bottom:16px}
.sk i,.sk-title{display:block;background:linear-gradient(90deg,#e2e8f0,#f1f5f9,#e2e8f0);background-size:200% 100%;animation:skm 1.2s linear infinite}
.sk i{height:12px;border-radius:6px;margin:8px 0;width:85%}
@keyframes skm{from{background-position:200% 0}to{background-position:-200% 0}}
/* ---------- Galeri foto ---------- */
.ph-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.ph-card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--sh)}
.ph-card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;cursor:zoom-in;background:#e2e8f0}
.ph-meta{padding:8px 10px}
.ph-strip{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.ph-strip img{width:72px;height:72px;object-fit:cover;border-radius:8px;cursor:zoom-in;background:#e2e8f0}
.ph-pin{width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid #7c3aed;display:flex;align-items:center;justify-content:center;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.4)}
/* ---------- Komposer cetak peta (layout ArcGIS) ---------- */
#mapPrint{position:fixed;inset:0;z-index:2600;background:#475569;display:flex;flex-direction:column}
.pm-bar .btn:not(.p){color:#0f172a}
.pm-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#0f172a;color:#fff;padding:8px 12px}
.pm-stage{flex:1;overflow:auto;padding:12px}
.sheet{background:#fff;color:#000;box-shadow:0 10px 40px rgba(0,0,0,.45);transform-origin:0 0;display:flex;gap:4mm;overflow:hidden;font-family:Arial,Helvetica,sans-serif;box-sizing:border-box}
.sheet.port{flex-direction:column}
.pm-frame{position:relative;border:0.6mm solid #000;flex:none;box-sizing:border-box}
.pm-neat{position:absolute;border:0.35mm solid #000;box-sizing:border-box}
#pmMap{width:100%;height:100%;background:#f8fafc}
.pm-coords{position:absolute;inset:0;pointer-events:none}
.pm-c{position:absolute;font-size:7.2pt;white-space:nowrap;color:#000}
.pm-c.top{transform:translate(-50%,-100%)}.pm-c.bot{transform:translate(-50%,0)}
.pm-c.left{transform:translate(-100%,-50%) rotate(-90deg) translate(50%,-50%);transform-origin:100% 50%}
.pm-c.right{transform:translate(0,-50%) rotate(90deg) translate(-50%,-50%);transform-origin:0 50%}
.pm-panel{display:flex;flex-direction:column;gap:2.5mm;flex:none;box-sizing:border-box}

var LB = { s: 1, x: 0, y: 0, pts: {}, img: null };

/* ---------------- Kompres gambar ---------------- */
function readImage(file, maxDim, quality, mime) {
  return new Promise(function (res, rej) {
    if (!file) return res('');
    if (!/^image\//.test(file.type)) return rej(new Error('Berkas harus gambar.'));
    var fr = new FileReader();
    fr.onerror = function () { rej(new Error('Gagal membaca berkas.')); };
    fr.onload = function () {
      if (file.type === 'image/svg+xml') return res(fr.result);
      var im = new Image();
      im.onerror = function () { rej(new Error('Gambar tidak dapat dibuka.')); };
      im.onload = function () {

        var c = document.createElement('canvas'); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);

    };

}

/* ---------------- API ---------------- */
function api(action, payload, opt) {
  opt = opt || {};
  var req = { action: action, payload: payload || {}, token: S.token, ua: navigator.userAgent.slice(0, 120) };
  if (!opt.silent) busy(true);
  var p;
  if (IS_GAS) {
    p = new Promise(function (res, rej) { google.script.run.withSuccessHandler(res).withFailureHandler(function (e) { rej({ code: 'NETWORK', message: (e && e.message) || 'Gagal menghubungi server.' }); }).api(req); });
  } else {
    var url = apiUrl();
    if (!url) { if (!opt.silent) busy(false); return Promise.reject({ code: 'NO_API_URL', message: 'URL Web App belum diatur. Klik ⚙ di halaman login.' }); }
    p = fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(req), redirect: 'follow' })
      .then(function (r) { if (!r.ok) throw { code: 'HTTP_' + r.status, message: 'Server merespons ' + r.status }; return r.json(); })
      .catch(function (e) { if (e && e.code) throw e; throw { code: 'NETWORK', message: 'Tidak dapat terhubung ke server (offline / URL salah).' }; });
  }
  return p.then(function (r) {
    if (!opt.silent) busy(false);

      var err = (r && r.error) || { code: 'UNKNOWN', message: 'Respons tidak valid' };
      if (err.code === 'UNAUTHORIZED' && action !== 'auth.login') { logoutLocal(); toast(err.message, 'bad'); }
      if (err.code === 'PASSWORD_CHANGE_REQUIRED') forcePasswordChange();

    }

  }, function (e) { if (!opt.silent) busy(false); throw e; });

/* ---------------- Outbox offline (survei) ---------------- */
function queueSurvey(payload) {

  return IDB.all('outbox').then(function (items) {

    items.forEach(function (it) {
      chain = chain.then(function () {
        var pl = Object.assign({}, it.payload, { idempotencyKey: it.idempotencyKey });
        return api(it.action, pl, { silent: true }).then(function (res) {
          if (it.action === 'photo.upload') okP++; else { okN += (res.observations || []).length; rej += (res.rejected || []).length; }

/* ---------------- Media (foto) dengan cache ---------------- */
function media(id) {
  if (!id) return Promise.resolve('');
  if (S.mediaCache[id]) return Promise.resolve(S.mediaCache[id]);
  return IDB.get('media', id).then(function (m) {
    if (m) { S.mediaCache[id] = m.dataUrl; return m.dataUrl; }
    return api('media.get', { driveId: id }, { silent: true }).then(function (r) { S.mediaCache[id] = r.dataUrl; IDB.put('media', { id: id, dataUrl: r.dataUrl }).catch(function () { }); return r.dataUrl; });
  }).catch(function () { return ''; });
}

/** <img> foto Drive: URL publik (ukuran lebar w) + data-drive untuk fallback proxy bila tak bisa dibagikan publik */
function imgTag(url, driveId, w, attrs) {
  return '<img loading="lazy" alt=""' + (url ? ' src="' + esc(url + (/=w\d+$/.test(url) ? '' : '=w' + (w || 800))) + '"' : '') + (driveId ? ' data-drive="' + esc(driveId) + '"' : '') + ' ' + (attrs || '') + '>';
}
function hydrate(root) {
  $$('img[data-drive]:not([data-h])', root || document).forEach(function (img) {
    img.setAttribute('data-h', '1');
    var id = img.getAttribute('data-drive');
    function viaProxy() { img.onerror = null; media(id).then(function (u) { if (u) img.src = u; }); }
    if (!img.getAttribute('src')) viaProxy(); else img.onerror = viaProxy;
  });
}
function userPhotoTag(u, cls, attrs) {
  if (!u || (!u.photoUrl && !u.photoDriveId)) return '';
  return imgTag(u.photoUrl, u.photoDriveId, 400, 'class="' + (cls || '') + '" ' + (attrs || ''));
}
new MutationObserver(function (ms) { for (var i = 0; i < ms.length; i++) if (ms[i].addedNodes.length) { hydrate(document); break; } }).observe(document.documentElement, { childList: true, subtree: true });

function kmlToGeoJson(txt) {
  var xml = new DOMParser().parseFromString(txt, 'text/xml');
  var feats = [];
  $$('Placemark', xml).forEach(function (pm) {
    var name = (pm.getElementsByTagName('name')[0] || {}).textContent || '';
    var props = { code: name.trim() };
    Array.prototype.forEach.call(pm.getElementsByTagName('SimpleData'), function (sd) { props[sd.getAttribute('name')] = sd.textContent; });
    Array.prototype.forEach.call(pm.getElementsByTagName('Data'), function (sd) { var v = sd.getElementsByTagName('value')[0]; if (v) props[sd.getAttribute('name')] = v.textContent; });
    var polys = Array.prototype.map.call(pm.getElementsByTagName('Polygon'), function (pg) {
      function ring(el) { return el.textContent.trim().split(/\s+/).map(function (c) { var p = c.split(','); return [Number(p[0]), Number(p[1])]; }); }
      var outer = pg.getElementsByTagName('outerBoundaryIs')[0]; var inners = pg.getElementsByTagName('innerBoundaryIs');
      var r = [ring(outer.getElementsByTagName('coordinates')[0])];
      Array.prototype.forEach.call(inners, function (ib) { r.push(ring(ib.getElementsByTagName('coordinates')[0])); });
      return r;
    });
    if (polys.length) feats.push({ type: 'Feature', properties: props, geometry: polys.length === 1 ? { type: 'Polygon', coordinates: polys[0] } : { type: 'MultiPolygon', coordinates: polys } });
  });
  return { type: 'FeatureCollection', features: feats };
}

function qrSvg(text) { try { var q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 3, margin: 1, scalable: true }); } catch (e) { return '<div class="small mono">' + esc(text) + '</div>'; } }
function scanQr(onCode) {
  var m = modal('Pindai QR / Barcode', '<video id="scanVideo" playsinline muted></video><div class="small muted" style="margin-top:8px" id="scanMsg">Arahkan kamera ke label QR sampel…</div><div class="row" style="margin-top:8px"><input class="i" id="scanManual" placeholder="atau ketik kode, mis. SMP-2026-…"><button class="btn" id="scanGo">Cari</button></div>', [], { onClose: stop });
  var stream = null, raf = 0, stopped = false;
  function stop() { stopped = true; cancelAnimationFrame(raf); if (stream) stream.getTracks().forEach(function (t) { t.stop(); }); }
  function done(code) { stop(); m.close(); onCode(code.trim()); }
  $('#scanGo', m.body).onclick = function () { var v = $('#scanManual', m.body).value; if (v) done(v); };
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { $('#scanMsg', m.body).textContent = 'Kamera tidak tersedia — ketik kode manual.'; return; }

function buildOverview() {
  var d = D(), ov = L.map('pmOv', { zoomControl: false, attributionControl: false, dragging: false, scrollWheelZoom: false, doubleClickZoom: false, boxZoom: false, keyboard: false, touchZoom: false, zoomAnimation: false, fadeAnimation: false, zoomSnap: 0 });
  PM.ov = ov;
  ov.setView(PM.map.getCenter(), Math.max(1, PM.map.getZoom() - 4), { animate: false });
  PM.ovTiles = [L.tileLayer(BASEMAPS['OpenStreetMap'].url, { maxZoom: 19 }).addTo(ov)];
  var all = (d.blocks || []).filter(function (b) { return b.boundaryGeoJson && fEstates().some(function (e) { return e.id === b.estateId; }); });
  var fg = L.featureGroup(all.map(function (b) { return L.geoJSON(b.boundaryGeoJson, { interactive: false, style: { color: '#334155', weight: 0.8, fillColor: '#94a3b8', fillOpacity: 0.35 } }); })).addTo(ov);
  var mb = PM.map.getBounds();
  PM.ovRect = L.rectangle(mb, { interactive: false, color: '#dc2626', weight: 2, fill: false }).addTo(ov);
  var tb = all.length ? fg.getBounds().extend(mb) : mb;
  ov.fitBounds(tb.pad(all.length ? 0.15 : 3));
  if (ov.getZoom() > PM.map.getZoom() - 2) ov.setZoom(Math.max(1, PM.map.getZoom() - 3));
}
Object.assign(ACT, {
  pmClose: closeComposer,
  pmRefresh: function () { var o = PM.opt; closeComposer(); openComposer(o); },
  pmZoom: function (el) {
    var steps = [500, 1000, 2000, 2500, 5000, 10000, 15000, 20000, 25000, 50000, 100000, 250000, 500000];
    var cur = niceScale(scaleAt(PM.map) * 0.999), i = steps.indexOf(cur); if (i < 0) i = 5;
    var nx = steps[Math.max(0, Math.min(steps.length - 1, i - Number(el.getAttribute('data-z'))))];
    PM.map.setView(PM.map.getCenter(), zoomForScale(nx, PM.map.getCenter().lat), { animate: false });
  },
  pmPrint: function () { setTimeout(function () { window.print(); }, 100); }
});

/* =================== Foto Dokumentasi (Google Drive, sheet hanya URL) =================== */
var PHOTO_MAX_PX = 1280, PHOTO_Q = 0.6; // ±100-250 KB per foto
var ENTITY_LBL = { BLOCK: 'Blok', TREE: 'Pohon', SAMPLE: 'Sampel', DISPATCH: 'Pengiriman', LAB_RESULT: 'Hasil lab', RECOMMENDATION: 'Rekomendasi', OBSERVATION: 'Observasi SOP', ESTATE: 'Estate', DIVISION: 'AFD', GENERAL: 'Umum' };

function photoSrc(p, w) { return p.shared ? p.url + '=w' + (w || 1600) : ''; }
function photoCard(p) {
  var b = byId(D().blocks, p.blockId), canDel = p.entityType !== 'OBSERVATION' && (p.uploadedBy === S.user.id || can('ESTATE_MANAGER', 'HEAD_AGRONOMY', 'LAB_MANAGER'));
  return '<div class="ph-card">' + imgTag(p.shared ? p.url : '', p.driveId, 480, 'data-act="zoomPhoto" data-pid="' + p.id + '"') +
    '<div class="ph-meta"><span class="pill info">' + esc(p.category) + '</span>' + (b ? ' <span class="pill">Blok ' + esc(b.code) + '</span>' : '') +
    '<div class="small" style="margin-top:4px">' + esc(p.caption || '—') + '</div><div class="small muted">' + esc(p.uploadedByName) + ' · ' + fmtD(p.takenAt, true) + ' · ' + (p.sizeKb || '?') + ' KB</div>' +
    '<div class="row" style="gap:4px;margin-top:6px">' + (p.lat ? '<button class="btn s" data-act="photoMap" data-pid="' + p.id + '">🗺</button>' : '') + '<a class="btn s" href="https://drive.google.com/file/d/' + esc(p.driveId) + '/view" target="_blank" rel="noopener">Drive ↗</a>' + (canDel ? '<button class="btn s d" data-act="delPhoto" data-pid="' + p.id + '">🗑</button>' : '') + '</div></div></div>';
}
/** Strip foto untuk entitas (sampel, rekomendasi, blok, …) + tombol unggah */
function photoStrip(et, eid, cat) {
  var list = (D().photos || []).filter(function (p) { return p.entityType === et && p.entityId === eid; });
  return '<div class="ph-strip">' + list.map(function (p) { return imgTag(p.shared ? p.url : '', p.driveId, 240, 'data-act="zoomPhoto" data-pid="' + p.id + '" title="' + esc(p.caption) + '"'); }).join('') +
    '<button class="btn s" data-act="photoAdd" data-et="' + et + '" data-eid="' + esc(eid) + '" data-cat="' + esc(cat || '') + '">📷 + Foto</button></div>';
}

VIEWS.docs = function () {
  var d = D(), f = S.sub.docF || {};
  var list = estOf(d.photos).filter(function (p) {
    if (f.cat && p.category !== f.cat) return false;
    if (S.sub.docBlock && p.blockId !== S.sub.docBlock) return false;
    if (f.q && (p.caption + ' ' + p.uploadedByName + ' ' + p.category).toLowerCase().indexOf(f.q.toLowerCase()) < 0) return false;
    return true;
  }).sort(function (a, b) { return a.takenAt < b.takenAt ? 1 : -1; });
  var blk = byId(d.blocks, S.sub.docBlock);
  var cats = d.photoCategories || [];
  var h = '<h2 class="pg">Foto Dokumentasi</h2><p class="pg-sub">' + esc(filterLabel()) + ' · Foto dikompres (maks ' + PHOTO_MAX_PX + ' px) dan disimpan di Google Drive; spreadsheet hanya menyimpan URL.</p>' +
    '<div class="row" style="margin-bottom:12px"><select class="i" style="max-width:220px" id="dCat"><option value="">Semua kategori</option>' + opts(cats, f.cat) + '</select><input class="i" style="max-width:220px" id="dQ" placeholder="Cari keterangan…" value="' + esc(f.q || '') + '">' + (blk ? '<span class="pill info">Blok ' + esc(blk.code) + ' <a href="#" data-act="docsClearBlock">✕</a></span>' : '') + '<span class="sp"></span><button class="btn p" data-act="photoAdd">📷 Unggah foto</button></div>' +
    '<div class="chips small" style="margin-bottom:10px">' + cats.map(function (c) { var n = estOf(d.photos).filter(function (p) { return p.category === c; }).length; return n ? '<span class="pill">' + esc(c) + ': ' + n + '</span>' : ''; }).join('') + '</div>' +
    (list.length ? '<div class="ph-grid">' + list.slice(0, 300).map(photoCard).join('') + '</div>' + (list.length > 300 ? '<p class="small muted">Menampilkan 300 dari ' + list.length + ' foto — persempit filter.</p>' : '') : '<div class="card empty">Belum ada foto untuk filter ini. Ketuk “Unggah foto”.</div>');
  $('#main').innerHTML = h;
  $('#dCat').onchange = function () { S.sub.docF = Object.assign({}, f, { cat: this.value }); VIEWS.docs(); };
  var q = $('#dQ'); q.oninput = function () { clearTimeout(q._t); q._t = setTimeout(function () { S.sub.docF = Object.assign({}, f, { q: q.value }); VIEWS.docs(); var n = $('#dQ'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 300); };
};

function queueAction(action, payload) {
  var item = { id: uid('ob'), idempotencyKey: uid('idem'), action: action, payload: payload, status: 'PENDING', retry: 0, createdAt: new Date().toISOString(), error: '' };
  return IDB.put('outbox', item).then(refreshOutbox).then(function () { return item; });
}

Object.assign(ACT, {
  docsBlock: function (el) { S.sub.docBlock = el.getAttribute('data-id'); if (MAPV.map) MAPV.map.closePopup(); go('docs'); },
  docsClearBlock: function () { S.sub.docBlock = ''; VIEWS.docs(); },
  zoomPhoto: function (el) {
    var p = byId(D().photos, el.getAttribute('data-pid'));
    var cap = p ? p.category + ' — ' + (p.caption || '') + ' (' + fmtD(p.takenAt, true) + ')' : 'Foto';
    var src = p && p.shared ? photoSrc(p, 1600) : el.getAttribute('src');
    if (src) zoomImage(src, cap, p && p.lat ? { label: '🗺 Lihat di peta', onClick: function () { ACT.photoMap(null, p); } } : null);
    else if (p) media(p.driveId).then(function (u) { if (u) zoomImage(u, cap); });
  },
  photoMap: function (el, p) {
    p = p || byId(D().photos, el.getAttribute('data-pid'));
    var go2 = function () { MAPV.map.setView([p.lat, p.lng], 19); MAPV.layers.photos.eachLayer(function (mk) { var ll = mk.getLatLng(); if (Math.abs(ll.lat - p.lat) < 1e-9 && Math.abs(ll.lng - p.lng) < 1e-9) mk.openPopup(); }); };
    if (S.tab === 'map' && MAPV.map) go2(); else { go('map'); var t = setInterval(function () { if (MAPV.map && MAPV.layers.photos) { clearInterval(t); setTimeout(go2, 300); } }, 200); setTimeout(function () { clearInterval(t); }, 10000); }
  },
  delPhoto: function (el) { var id = el.getAttribute('data-pid'); confirmBox('Hapus foto ini? File di Google Drive akan dipindahkan ke sampah.', function () { saveThen('photo.delete', { id: id }, 'Foto dihapus.'); }, { danger: true }); },
  /** Unggah satu/banyak foto: kompres → Drive (online) atau antrean offline */
  photoAdd: function (el) {
    var d = D(), et = el && el.getAttribute('data-et') || '', eid = el && el.getAttribute('data-eid') || '', cat0 = el && el.getAttribute('data-cat') || 'Kondisi Blok';
    if (et === 'BLOCK') { eid = eid; }
    var bl = estOf(d.blocks), files = [];
    var target = et ? '<div class="alert info small">Ditautkan ke ' + esc(ENTITY_LBL[et] || et) + ': <b>' + esc(entityName(et, eid)) + '</b></div>' :
      '<label class="f">Blok (opsional)<select class="i" name="blockId">' + opts(bl, S.sub.docBlock || '', function (b) { return 'Blok ' + b.code + ' · ' + ((byId(d.divisions, b.divisionId) || {}).code || ''); }, '— tanpa blok —') + '</select></label><label class="f">Estate<select class="i" name="estateId">' + opts(myEstates(), S.f.est, function (e) { return e.code + ' · ' + e.name; }) + '</select></label>';
    var m = modal('Unggah Foto Dokumentasi', '<div class="grid">' + target + '<label class="f">Kategori<select class="i" name="category">' + opts(d.photoCategories || [], cat0) + '</select></label><label class="f">Keterangan<textarea class="i" name="caption" placeholder="Contoh: kondisi piringan & gawangan sebelum sampling"></textarea></label>' +
      '<label class="chk"><input type="checkbox" name="gps" checked> Sertakan koordinat GPS saat ini</label>' +
      '<div class="row"><button class="btn" type="button" id="phCam">📷 Kamera</button><button class="btn" type="button" id="phGal">🖼 Galeri (bisa banyak)</button></div><div id="phPrev" class="ph-strip"></div><div id="phInfo" class="small muted"></div></div>',
      [{ label: 'Batal' }, { label: 'Unggah', cls: 'p', keep: true, onClick: function (b, close, btn) {
        if (!files.length) { toast('Pilih minimal 1 foto.', 'bad'); return false; }
        var v = formVals(b);
        if (!et && !v.blockId && !v.estateId) { toast('Pilih blok atau estate.', 'bad'); return false; }
        btn.disabled = true;
        var pos = v.gps && GPS.pos ? GPS.pos : null, done = 0, queued = 0;
        var chain = Promise.resolve();
        files.forEach(function (img, i) {
          chain = chain.then(function () {
            var pl = { image: img, category: v.category, caption: v.caption, entityType: et || (v.blockId ? 'BLOCK' : 'ESTATE'), entityId: et ? eid : (v.blockId || v.estateId), lat: pos ? pos.lat : null, lng: pos ? pos.lng : null, takenAt: new Date().toISOString() };
            $('#phInfo', b).textContent = 'Mengunggah ' + (i + 1) + ' / ' + files.length + '…';
            if (!navigator.onLine) return queueAction('photo.upload', pl).then(function () { queued++; });
            return api('photo.upload', pl, { silent: true }).then(function () { done++; }, function (e) { if (e.code === 'NETWORK') return queueAction('photo.upload', pl).then(function () { queued++; }); throw e; });
          });
        });
        chain.then(function () { close(); toast((done ? done + ' foto terunggah ke Google Drive. ' : '') + (queued ? queued + ' foto masuk antrean offline.' : ''), 'ok'); if (done) loadData(true); })
          .catch(function (e) { btn.disabled = false; fail(e); });
        return false;
      } }]);
    function add(fl) {
      Array.prototype.slice.call(fl || []).slice(0, 20).forEach(function (f) {
        readImage(f, PHOTO_MAX_PX, PHOTO_Q).then(function (u) {
          files.push(u);
          $('#phPrev', m.body).insertAdjacentHTML('beforeend', '<img src="' + u + '" data-act="zoomData">');
          $('#phInfo', m.body).textContent = files.length + ' foto · total ' + fmtN(files.reduce(function (a, x) { return a + x.length * 0.75 / 1024; }, 0), 0) + ' KB setelah kompresi';
        }).catch(fail);
      });
    }
    function pick(capture) { var i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; if (capture) i.setAttribute('capture', 'environment'); else i.multiple = true; i.onchange = function () { add(i.files); }; i.click(); }
    $('#phCam', m.body).onclick = function () { pick(true); };
    $('#phGal', m.body).onclick = function () { pick(false); };
    if (!GPS.pos && navigator.geolocation) navigator.geolocation.getCurrentPosition(function (p) { GPS.pos = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, t: Date.now() }; }, function () { }, { enableHighAccuracy: true, timeout: 15000 });
  }
});
function entityName(et, id) {
  var d = D(), x;
  if (et === 'BLOCK') { x = byId(d.blocks, id); return x ? 'Blok ' + x.code : id; }
  if (et === 'SAMPLE') { x = byId(d.samples, id); return x ? x.code : id; }
  if (et === 'RECOMMENDATION') { x = byId(d.recommendations, id); return x ? x.recCode : id; }
  if (et === 'LAB_RESULT') { x = byId(d.labResults, id); var s = x && byId(d.samples, x.sampleId); return s ? 'Hasil ' + s.code : id; }
  if (et === 'DISPATCH') { x = byId(d.dispatches, id); return x ? x.dispatchNumber : id; }
  if (et === 'TREE') { x = byId(d.trees, id); return x ? x.tagCode : id; }
  return id;
}

document.addEventListener('DOMContentLoaded', boot);
